short_bio_text_justify: false
short_bio: >-
  <p>
    Hi! I'm a PhD student in Information Sciences supervised by
    <a href="https://www.wangdong.org/" target="_blank">Prof. Dong Wang</a>
    at the University of Illinois Urbana-Champaign.
    Before that, I graduated with an M.S. in Computer Science from
    Georgia Institute of Technology and a BSc in Computer Science (Hons)
    from University College London. My research interests are:
  </p>
  <ul>
    <li><strong>Long-Horizon Agent Safety:</strong> reliability of autonomous agents over extended interactions, including memory and persistent-state safety, behavioral monitoring, and action attribution.</li>
    <li><strong>Trustworthy AI:</strong> model alignment, safety, fairness, privacy, and tradeoffs introduced by alignment interventions.</li>
    <li><strong>LLM Post-Training and Self-Improvement:</strong> efficient adaptation of language agents.</li>
  </ul>
  <p class="intern-search">
    I am actively seeking U.S.-based research internship opportunities for Summer 2027 in areas related to agentic AI, AI safety, and trustworthy information retrieval.
  </p>

